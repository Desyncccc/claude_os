# RadiaNT boot menu (GRUB 2, BIOS and UEFI).
# The video mode is requested by the kernel's Multiboot2 header (1280x720x32 by
# default); GRUB falls back to the closest mode the firmware offers.
set timeout=3
set default=0
insmod all_video

menuentry "RadiaNT OS  (x64)" {
    multiboot2 /boot/radkrnl.elf
    module2 /system/hello.exe hello.exe
    module2 /system/primes.exe primes.exe
    module2 /system/clock.exe clock.exe
    module2 /system/crash.exe crash.exe
    module2 /system/spin.exe spin.exe
    boot
}

menuentry "Reboot" {
    reboot
}
