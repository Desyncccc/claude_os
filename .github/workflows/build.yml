name: Build and boot test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential nasm clang lld xorriso mtools \
            grub-pc-bin grub-efi-amd64-bin grub-common qemu-system-x86

      - name: Build the ISO
        run: make

      - name: Boot it in QEMU
        run: make test

      - uses: actions/upload-artifact@v4
        with:
          name: radiant-x64-iso
          path: build/radiant-x64.iso
